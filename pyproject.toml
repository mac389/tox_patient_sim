[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toxsim"
version = "0.1.0"
description = "Context-aware synthetic poisoned-patient simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "toxsim contributors" }]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
  "scipy>=1.9",
]

[project.optional-dependencies]
cli = [
  "rich>=13.0",
  "tqdm>=4.64",
]
test = [
  "pytest>=7.0",
]

[project.scripts]
toxsim-generate = "toxsim.generate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/toxsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
